name: workflow

on:
  push:
    branches:
      - main
    paths-ignore:
      - "README.md"

permissions:
  contents: read

jobs:
  integration:
    name: Continuous Integration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Lint code
        run: echo "Linting repository"

      - name: Run unit tests
        run: echo "Running unit tests"

  build-and-push-ecr-image:
    name: Continuous Delivery
    needs: integration
    runs-on: ubuntu-latest

    outputs:
      image: ${{ steps.build-image.outputs.image }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Install Utilities
        run: |
          sudo apt-get update
          sudo apt-get install -y jq unzip

      - name: Ensure pip is installed
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip

      - name: Install awscli
        run: |
          pip install --upgrade pip
          pip install awscli

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to Amazon ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY_NAME }}
          IMAGE_TAG: latest
        run: |
          echo "Using registry: $ECR_REGISTRY"
          echo "Using repository: $ECR_REPOSITORY"

          # Ensure ECR repository exists
          aws ecr describe-repositories \
            --repository-names "$ECR_REPOSITORY" >/dev/null 2>&1 || \
          aws ecr create-repository \
            --repository-name "$ECR_REPOSITORY"

          # Build and push
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

          # Expose full image URI as job output (modern method)
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT
          echo "PUSHED IMAGE: $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

  continuous-deployment:
    name: Continuous Deployment
    needs: build-and-push-ecr-image
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Pull image from build job output
        env:
          FALLBACK_REPO: ${{ secrets.ECR_REPOSITORY_NAME }}
          FALLBACK_TAG: latest
        run: |
          IMAGE_URI="${{ needs.build-and-push-ecr-image.outputs.image }}"
          if [ -z "$IMAGE_URI" ]; then
            echo "Build job output image is empty. Constructing fallback from ECR login and secrets."
            REGISTRY="${{ steps.login-ecr.outputs.registry }}"
            if [ -z "$REGISTRY" ] || [ -z "$FALLBACK_REPO" ]; then
              echo "Unable to determine ECR registry or repository."
              exit 1
            fi
            IMAGE_URI="$REGISTRY/$FALLBACK_REPO:$FALLBACK_TAG"
          fi
          echo "Pulling image: $IMAGE_URI"
          docker pull "$IMAGE_URI"
          # Export for subsequent steps
          echo "IMAGE_URI=$IMAGE_URI" >> "$GITHUB_ENV"

      - name: Stop and remove container if running
        run: |
          docker ps -q --filter "name=cnncls" | grep -q . && \
          docker stop cnncls && docker rm -fv cnncls || true

      - name: Run Docker Image to serve users
        run: |
          docker run -d -p 8000:8000 --name=cnncls \
            -v /home/ubuntu/model.pth:/app/artifacts/training/model.pth \
            "$IMAGE_URI"

      - name: Clean previous images and containers
        run: |
          docker system prune -f
